name: Build Lightweight Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install the EXE builder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build lightweight native Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Hamleys Closing Announcer" --add-data "1st_announcement.mp3;." --add-data "2nd_announcement.mp3;." --add-data "3th_announcement.mp3;." main.py

      - name: Upload standalone Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hamleys-Closing-Announcer-Lightweight-Windows
          path: dist/Hamleys Closing Announcer.exe
          if-no-files-found: error
          retention-days: 30
